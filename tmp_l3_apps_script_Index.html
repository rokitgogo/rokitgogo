rder-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.content{padding:24px;max-width:1450px;margin:auto}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.pad{padding:18px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:6px}.hero{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.hero h1{font-size:25px;margin:0}.muted{color:var(--muted)}.progress{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.two{grid-template-columns:1.3fr 1fr}.questionStage{min-height:530px;padding:25px;display:flex;flex-direction:column}.qtop{display:flex;justify-content:space-between;gap:10px}.tag{font-size:12px;font-weight:900;color:var(--blue)}.question{font-size:clamp(25px,3.2vw,45px);font-weight:950;line-height:1.35;letter-spacing:-.04em;margin:32px 0 18px}.reveal{display:none;padding:14px;border-radius:12px;margin-top:10px;line-height:1.6}.reveal.show{display:block}.h1{background:#fff6df;border:1px solid #f1d491}.h2{background:#edf5ff;border:1px solid #bcd4fb}.ans{background:#e9f8f1;border:1px solid #a9dfc8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.score button{padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:850}.list{display:grid;gap:9px}.row{display:grid;grid-template-columns:100px 1fr 70px;gap:10px;align-items:center;font-size:13px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid #eef1f5;text-align:left}.table th{font-size:11px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:850;background:#eef4ff;color:#3369d5}.plans{grid-template-columns:repeat(3,1fr)}.plan{padding:15px}.plan b{color:var(--blue)}.plan ul{padding-left:18px;line-height:1.7;font-size:13px}.weak{display:grid;grid-template-columns:1fr 1fr;gap:10px}.weak .card{padding:14px}.practical{grid-template-columns:1fr 1fr}.toast{position:fixed;right:20px;bottom:20px;background:#12233c;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:30}.toast.show{display:block}.mobileNav{display:none}.loading{position:fixed;inset:0;background:rgba(255,255,255,.75);display:grid;place-items:center;z-index:99;font-weight:900}.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;place-items:center;z-index:50;padding:20px}.modal.show{display:grid}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(600px,100%);max-height:85vh;overflow:auto}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:14px;padding-bottom:82px}.stats,.two,.plans,.weak,.practical{grid-template-columns:1fr}.score{grid-template-columns:1fr 1fr}.top{padding:0 14px}.mobileNav{display:flex;position:fixed;left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid var(--line);z-index:20;justify-content:space-around}.mobileNav button{flex:1;border:0;background:#fff;font-size:11px;font-weight:800}.question{font-size:28px}.questionStage{min-height:calc(100vh - 150px)}}
</style></head><body><div id="loading" class="loading hidden">불러오는 중...</div><section id="login" class="login"><div class="loginbox"><div class="brand">L3 외부평가 준비실</div><div class="sub">전자기기하드웨어개발 · 2026.12.10<br>처음 접속하면 이름과 생년월일로 자동 등록됩니다.</div><div id="studentLoginBox"><div class="field"><label>이름</label><input id="sname" autocomplete="name" placeholder="예: 홍길동"></div><div class="field"><label>생년월일</label><input id="sdob" inputmode="numeric" maxlength="8" placeholder="예: 090315 또는 20090315"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="studentLogin()">학생 입장</button><button class="btn" style="width:100%;margin-top:8px" onclick="showTeacherLogin(true)">교사 로그인</button></div><div id="teacherLoginBox" class="hidden"><div class="field"><label>교사 아이디</label><input id="tid" placeholder="teacher"></div><div class="field"><label>교사 비밀번호</label><input id="tpw" type="password" placeholder="비밀번호"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="teacherLogin()">교사 로그인</button><button class="btn" style="width:100%;margin-top:8px" onclick="showTeacherLogin(false)">학생 화면으로</button></div><div id="loginErr" class="error"></div><div class="muted" style="font-size:11px;margin-top:14px;line-height:1.5">생년월일 원문은 저장하지 않고 확인용 해시값만 저장합니다. 같은 이름으로 이미 등록된 경우 생년월일이 일치해야 로그인됩니다.</div></div></section><section id="app" class="app hidden"><aside class="side"><h2>L3 외부평가 준비실</h2><small>전자기기하드웨어개발</small><div class="dday"><b id="dday">D-14</b><small style="display:block">2026.12.10 외부평가</small></div><div id="nav" class="nav"></div></aside><main class="main"><header class="top"><div><b id="title">대시보드</b><div class="muted" style="font-size:11px" id="who"></div></div><button class="btn" onclick="logout()">로그아웃</button></header><div id="content" class="content"></div></main><div id="mobileNav" class="mobileNav"></div></section><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div><script>
let token=localStorage.getItem('l3token')||'',DATA=null,page='dash',session={pool:[],i:0,q:null,hint:0,start:0,studentId:null};
const scoreVal=r=>({A:1,B:.75,C:.4,D:0}[r]??0);const unitLabel=u=>u==='hw'?'하드웨어 부품 선정':u==='cert'?'제품 자체 인증 진행':u;function gas(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e)))[fn](...args))}function load(b=true){document.getElementById('loading').classList.toggle('hidden',!b)}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showTeacherLogin(on){document.getElementById('studentLoginBox').classList.toggle('hidden',on);document.getElementById('teacherLoginBox').classList.toggle('hidden',!on);document.getElementById('loginErr').textContent=''}
async function studentLogin(){loginErr.textContent='';load();try{let r=await gas('loginStudent',sname.value,sdob.value);if(!r.ok){loginErr.textContent=r.message;return}token=r.token;localStorage.setItem('l3token',token);await boot()}catch(e){loginErr.textContent=e.message}finally{load(false)}}
async function teacherLogin(){loginErr.textContent='';load();try{let r=await gas('loginTeacher',tid.value,tpw.value);if(!r.ok){loginErr.textContent=r.message;return}token=r.token;localStorage.setItem('l3token',token);await boot()}catch(e){loginErr.textContent=e.message}finally{load(false)}}
async function boot(){if(!token)return;load();try{DATA=await gas('getBootstrap',token);login.classList.add('hidden');app.classList.remove('hidden');who.textContent=DATA.role==='student'?`${DATA.student.name}`:'교사용 관리자';initNav();go('dash');setDday()}catch(e){localStorage.removeItem('l3token');token='';login.classList.remove('hidden');app.classList.add('hidden')}finally{load(false)}}function logout(){localStorage.removeItem('l3token');location.reload()}function setDday(){let n=Math.ceil((new Date('2026-12-10T00:00:00')-new Date())/86400000);dday.textContent=n>0?`D-${n}`:n===0?'D-DAY':`D+${-n}`}
function initNav(){let items=DATA.role==='student'?[['dash','🏠','내 현황'],['study','📚','오늘 학습'],['practice','🎤','면접 연습'],['weak','🎯','취약문제'],['d1','🔥','D-1'],['practical','🛠️','실기 기록']]:[['dash','🏠','대시보드'],['students','👥','학생 현황'],['interview','🎤','랜덤 면접'],['weak','🎯','전체 취약'],['practical','🛠️','실기 관리'],['settings','⚙️','학생 설정']];nav.innerHTML=items.map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('');mobileNav.innerHTML=items.slice(0,5).map(x=>`<button onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));let map={dash:'대시보드',study:'오늘의 학습',practice:'면접 연습',weak:'취약문제',d1:'D-1 최종정리',practical:'실기',students:'학생 현황',interview:'랜덤 면접',settings:'학생 설정'};title.textContent=map[p]||p;if(DATA.role==='student')renderStudent(p);else renderTeacher(p)}
function latest(attempts){let m={};attempts.forEach(a=>m[a.questionId]=a);return m}function pct(unit){let m=latest(DATA.attempts),qs=DATA.questions.filter(q=>!unit||q.unit===unit);return Math.round(qs.reduce((s,q)=>s+scoreVal(m[q.id]?.result),0)/qs.length*100)}function weakQs(){let m=latest(DATA.attempts);return DATA.questions.filter(q=>['C','D'].includes(m[q.id]?.result)).sort((a,b)=>scoreVal(m[a.id]?.result)-scoreVal(m[b.id]?.result))}
function renderStudent(p){if(p==='dash')return studentDash();if(p==='study')return studentStudy();if(p==='practice')return startStudentPractice('all');if(p==='weak')return studentWeak();if(p==='d1')return studentD1();if(p==='practical')return studentPractical()}
function studentDash(){let w=weakQs();content.innerHTML=`<div class="hero"><div><h1>${esc(DATA.student.name)}의 준비 현황</h1><p class="muted">학교·집·휴대폰 어디서든 기록이 이어집니다.</p></div></div><div class="grid stats"><div class="card pad stat"><span>전체 숙련도</span><b>${pct()}%</b></div><div class="card pad stat"><span>하드웨어</span><b>${pct('하드웨어 부품 선정')}%</b></div><div class="card pad stat"><span>제품 자체 인증</span><b>${pct('제품 자체 인증 진행')}%</b></div><div class="card pad stat"><span>취약문제</span><b>${w.length}</b></div></div><div class="grid two" style="margin-top:15px"><div class="card pad"><h3>바로 학습하기</h3><p class="muted">60문제 중 랜덤으로 연습합니다. 결과는 자동 저장됩니다.</p><button class="btn primary" onclick="startStudentPractice('all')">전체 60문제 시작</button> ${w.length?`<button class="btn" onclick="startStudentPractice('weak')">취약문제만</button>`:''}</div><div class="card pad"><h3>최근 기록</h3><div class="list">${DATA.attempts.slice(-6).reverse().map(a=>`<div>${a.questionId} · <b>${a.result}</b> <span class="muted">${a.assessmentType==='teacher_interview'?'교사평가':'자기평가'}</span></div>`).join('')||'<div class="muted">아직 기록이 없습니다.</div>'}</div></div></div>`}
function todayKey(){let d=new Date();return d.toISOString().slice(0,10)}function studentStudy(){let key=todayKey(),pl=DATA.plans.find(x=>x.date===key)||DATA.plans.find(x=>x.date==='2026-11-30')||DATA.plans[0];content.innerHTML=`<div class="hero"><div><h1>오늘의 학습</h1><p class="muted">${esc(pl?.date||'')} · 시험 전 계획</p></div></div><div class="grid plans">${DATA.plans.map(x=>`<div class="card plan"><b>${esc(x.date)}</b><h3>${esc(x.title||x.interview||'학습')}</h3><ul>${(x.tasks||x.items||[x.interview,x.practical].filter(Boolean)).map(y=>`<li>${esc(y)}</li>`).join('')}</ul></div>`).join('')}</div>`}
function makePool(mode){let q=[...DATA.questions],m=latest(DATA.attempts);if(mode==='weak')q=q.filter(x=>['C','D'].includes(m[x.id]?.result));if(mode==='new')q=q.filter(x=>!m[x.id]);if(mode==='wrong')q=q.filter(x=>m[x.id]?.result==='D');for(let i=q.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}return q}
function startStudentPractice(mode){session.pool=makePool(mode);if(!session.pool.length){content.innerHTML='<div class="card pad">해당 조건의 문제가 없습니다.</div>';return}session.i=0;session.q=session.pool[0];session.hint=0;session.start=Date.now();renderPractice()}
function renderPractice(){let q=session.q;content.innerHTML=`<div class="card questionStage"><div class="qtop"><span class="tag">${esc(unitLabel(q.unit))} · Q${q.number}</span><span class="chip">${session.i+1} / ${session.pool.length}</span></div><div class="question">${esc(q.question)}</div><div id="h1" class="reveal h1"><b>힌트 1</b><br>${esc(q.hint1)}</div><div id="h2" class="reveal h2"><b>힌트 2</b><br>${esc(q.hint2)}</div><div id="ans" class="reveal ans"><b>모범답안</b><br>${esc(q.answer)}</div><div class="actions"><button class="btn" onclick="hint(1)">힌트 1</button><button class="btn" onclick="hint(2)">힌트 2</button><button class="btn green" onclick="answer()">정답 보기</button></div><div class="score"><button onclick="record('A')">◎ 바로 답함</button><button onclick="record('B')">○ 힌트 후</button><button onclick="record('C')">△ 일부 앎</button><button onclick="record('D')">X 모름</button></div></div>`}
function hint(n){document.getElementById('h'+n).classList.add('show');session.hint=Math.max(session.hint,n)}function answer(){ans.classList.add('show')}async function record(r){load();try{let out=await gas('recordAttempt',token,{questionId:session.q.id,result:r,hintUsed:session.hint,answerTime:Math.round((Date.now()-session.start)/1000)});DATA.attempts=out.attempts||DATA.attempts;toast('기록 저장됨');session.i++;if(session.i>=session.pool.length){studentDash();return}session.q=session.pool[session.i];session.hint=0;session.start=Date.now();renderPractice()}catch(e){alert(e.message)}finally{load(false)}}
function studentWeak(){let w=weakQs();content.innerHTML=`<div class="hero"><div><h1>내 취약문제</h1><p class="muted">최근 상태가 △ 또는 X인 문항입니다.</p></div>${w.length?'<button class="btn primary" onclick="startStudentPractice(\'weak\')">취약문제만 풀기</button>':''}</div><div class="weak">${w.map(q=>`<div class="card"><b>${q.id}</b><div style="margin-top:6px">${esc(q.question)}</div><div class="muted" style="margin-top:5px">${esc(q.hint1)}</div></div>`).join('')||'<div class="card pad">취약문제가 없습니다.</div>'}</div>`}
function studentD1(){content.innerHTML=`<div class="hero"><div><h1>D-1 최종정리</h1><p class="muted">긴 답안 대신 핵심 키워드만 빠르게 확인합니다.</p></div></div><div class="weak">${DATA.questions.map(q=>`<div class="card"><b>${q.id}</b><div>${esc(q.question)}</div><div class="chip" style="margin-top:7px">${esc(q.hint1)}</div></div>`).join('')}</div>`}function studentPractical(){content.innerHTML=`<div class="hero"><div><h1>내 실기 기록</h1><p class="muted">교사가 입력한 실기 연습 결과입니다.</p></div></div><div class="card pad">${DATA.practicals.length?`<table class="table"><tr><th>날짜</th><th>시간</th><th>완성</th><th>동작</th><th>진단</th><th>피드백</th></tr>${DATA.practicals.slice().reverse().map(p=>`<tr><td>${p.date.slice(0,10)}</td><td>${p.elapsed}분</td><td>${esc(p.completion)}</td><td>${esc(p.operation)}</td><td>${esc(p.diagnosis)}</td><td>${esc(p.comment)}</td></tr>`).join('')}</table>`:'아직 실기 기록이 없습니다.'}</div>`}
function renderTeacher(p){if(p==='dash')return teacherDash();if(p==='students')return teacherStudents();if(p==='interview')return teacherInterviewStart();if(p==='weak')return teacherWeak();if(p==='practical')return teacherPractical();if(p==='settings')return teacherSettings()}
function teacherDash(){let avg=DATA.dashboard.length?Math.round(DATA.dashboard.reduce((a,s)=>a+s.total,0)/DATA.dashboard.length):0;content.innerHTML=`<div class="hero"><div><h1>교사용 대시보드</h1><p class="muted">등록된 학생들의 온라인 학습 기록을 한눈에 확인합니다.</p></div><button class="btn" onclick="refreshTeacher()">새로고침</button></div><div class="grid stats"><div class="card pad stat"><span>학생</span><b>${DATA.dashboard.length}명</b></div><div class="card pad stat"><span>평균 숙련도</span><b>${avg}%</b></div><div class="card pad stat"><span>취약 문항</span><b>${DATA.weak.length}</b></div><div class="card pad stat"><span>시험일</span><b style="font-size:20px">12.10</b></div></div><div class="card pad" style="margin-top:15px"><table class="table"><tr><th>학생</th><th>전체</th><th>하드웨어</th><th>제품인증</th><th>취약</th><th>학습횟수</th></tr>${DATA.dashboard.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class="muted">최근 접속 ${s.lastLogin?String(s.lastLogin).slice(0,10):'-'}</span></td><td>${s.total}%</td><td>${s.hw}%</td><td>${s.cert}%</td><td>${s.weak}</td><td>${s.attempts}</td></tr>`).join('')}</table></div>`}
async function refreshTeacher(){load();DATA=await gas('getBootstrap',token);load(false);renderTeacher(page)}function teacherStudents(){teacherDash()}function teacherWeak(){content.innerHTML=`<div class="hero"><div><h1>전체 취약문제</h1><p class="muted">△/X 학생이 많은 순서입니다.</p></div></div><div class="weak">${DATA.weak.map(x=>`<div class="card"><b>${x.id} · 취약 ${x.count}명</b><div>${esc(x.question)}</div><div class="chip" style="margin-top:6px">전체 숙련 ${x.pct}%</div></div>`).join('')||'<div class="card pad">아직 취약 데이터가 없습니다.</div>'}</div>`}
function teacherInterviewStart(){content.innerHTML=`<div class="hero"><div><h1>교사 주도 랜덤 면접</h1><p class="muted">학생과 문제를 골라 ◎○△X로 기록합니다.</p></div></div><div class="card pad"><div class="field"><label>학생</label><select id="tstudent">${DATA.students.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.id})</option>`).join('')}</select></div><button class="btn primary" onclick="startTeacherInterview()">랜덤 문제 시작</button></div>`}function startTeacherInterview(){session.studentId=tstudent.value;session.pool=[...DATA.questions].sort(()=>Math.random()-.5);session.i=0;session.q=session.pool[0];session.hint=0;session.start=Date.now();renderTeacherInterview()}function renderTeacherInterview(){let q=session.q,s=DATA.students.find(x=>x.id===session.studentId);content.innerHTML=`<div class="card questionStage"><div class="qtop"><span class="tag">${esc(unitLabel(q.unit))} · Q${q.number}</span><span class="chip">${esc(s.name)}</span></div><div class="question">${esc(q.question)}</div><div id="h1" class="reveal h1">${esc(q.hint1)}</div><div id="h2" class="reveal h2">${esc(q.hint2)}</div><div id="ans" class="reveal ans">${esc(q.answer)}</div><div class="actions"><button class="btn" onclick="hint(1)">힌트1</button><button class="btn" onclick="hint(2)">힌트2</button><button class="btn green" onclick="answer()">정답</button></div><div class="score"><button onclick="teacherRecord('A')">◎ 즉답</button><button onclick="teacherRecord('B')">○ 힌트 후</button><button onclick="teacherRecord('C')">△ 부분</button><button onclick="teacherRecord('D')">X 모름</button></div></div>`}async function teacherRecord(r){load();try{await gas('recordAttempt',token,{studentId:session.studentId,questionId:session.q.id,result:r,hintUsed:session.hint,answerTime:Math.round((Date.now()-session.start)/1000)});toast('교사 평가 저장됨');session.i++;session.q=session.pool[session.i%session.pool.length];session.hint=0;session.start=Date.now();renderTeacherInterview()}finally{load(false)}}
function teacherPractical(){content.innerHTML=`<div class="hero"><div><h1>실기 관리</h1><p class="muted">학생별 실기 결과를 저장합니다.</p></div></div><div class="grid practical"><div class="card pad"><div class="field"><label>학생</label><select id="ps">${DATA.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>작업 시간(분)</label><input id="pt" type="number" value="60"></div><div class="field"><label>완성</label><select id="pc"><option>완성</option><option>미완성</option></select></div><div class="field"><label>동작</label><select id="po"><option>정상</option><option>오류</option></select></div><div class="field"><label>고장진단</label><select id="pd"><option>성공</option><option>부분 성공</option><option>실패</option></select></div><div class="field"><label>오류</label><input id="pe"></div><div class="field"><label>피드백</label><textarea id="pm"></textarea></div><button class="btn primary" onclick="savePrac()">저장</button></div><div class="card pad"><h3>최근 실기 기록</h3><table class="table"><tr><th>학생</th><th>시간</th><th>완성</th><th>동작</th></tr>${DATA.recentPracticals.slice(-15).reverse().map(p=>`<tr><td>${esc(DATA.students.find(s=>s.id===p.studentId)?.name||p.studentId)}</td><td>${p.elapsed}</td><td>${esc(p.completion)}</td><td>${esc(p.operation)}</td></tr>`).join('')}</table></div></div>`}async function savePrac(){load();try{await gas('savePractical',token,{studentId:ps.value,elapsed:pt.value,completion:pc.value,operation:po.value,diagnosis:pd.value,errors:pe.value,comment:pm.value});toast('실기 기록 저장됨');await refreshTeacher()}catch(e){alert(e.message)}finally{load(false)}}
function teacherSettings(){content.innerHTML=`<div class="hero"><div><h1>등록 학생 관리</h1><p class="muted">처음 접속한 학생이 자동 등록됩니다. 오등록 계정은 여기서 삭제할 수 있습니다.</p></div></div><div class="card pad"><table class="table"><tr><th>이름</th><th>등록일</th><th>최근 접속</th><th>관리</th></tr>${DATA.students.map(s=>`<tr><td><input id="nm_${s.id}" value="${esc(s.name)}" style="width:150px;padding:8px;border:1px solid var(--line);border-radius:8px"></td><td>${s.createdAt?String(s.createdAt).slice(0,10):'-'}</td><td>${s.lastLogin?String(s.lastLogin).slice(0,16).replace('T',' '):'-'}</td><td><button class="btn" onclick="rename('${s.id}')">이름 수정</button> <button class="btn red" onclick="removeStudent('${s.id}','${esc(s.name)}')">탈퇴</button></td></tr>`).join('')||'<tr><td colspan="4">아직 등록된 학생이 없습니다.</td></tr>'}</table></div><div class="card pad" style="margin-top:15px"><h3>교사 비밀번호 변경</h3><div class="field"><label>현재 비밀번호</label><input id="curpw" type="password"></div><div class="field"><label>새 비밀번호</label><input id="newpw" type="password"></div><button class="btn primary" onclick="changePw()">비밀번호 변경</button></div>`}
async function rename(id){load();try{await gas('renameStudent',token,id,document.getElementById('nm_'+id).value);await refreshTeacher();toast('이름 저장됨')}catch(e){alert(e.message)}finally{load(false)}}
async function removeStudent(id,name){if(!confirm(`${name} 계정을 탈퇴시키면 학습 기록과 실기 기록도 함께 삭제됩니다. 삭제할까요?`))return;load();try{await gas('deleteStudent',token,id);await refreshTeacher();toast('계정 삭제됨')}catch(e){alert(e.message)}finally{load(false)}}
async function changePw(){load();try{await gas('changeTeacherPassword',token,curpw.value,newpw.value);curpw.value='';newpw.value='';toast('교사 비밀번호 변경됨')}catch(e){alert(e.message)}finally{load(false)}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!login.classList.contains('hidden')){if(!teacherLoginBox.classList.contains('hidden'))teacherLogin();else studentLogin()}});if(token)boot();
</script></body></html>
